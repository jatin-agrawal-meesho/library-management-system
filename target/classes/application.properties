# ---------------------------------------------------------------------------
# Spring Boot reads this file automatically from the classpath at startup
# (src/main/resources is the standard place for non-code resources).
# Each line is a key=value setting that overrides a Spring Boot default.
# ---------------------------------------------------------------------------

# A human-readable name for this application. Appears in logs and tooling.
spring.application.name=library-management

# The TCP port the embedded Tomcat server listens on.
server.port=8080

# ---------------------------------------------------------------------------
# PostgreSQL datasource
# These values match docker-compose.yml. Spring Boot's auto-configuration reads
# them to build a connection pool (HikariCP). The JDBC driver is auto-detected
# from the URL prefix "jdbc:postgresql:".
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/library
spring.datasource.username=library
spring.datasource.password=library

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# ddl-auto=update: on startup Hibernate inspects our @Entity classes and
# CREATES or ALTERS tables to match them. Great for learning; in real
# production you'd use migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update

# Print every SQL statement Hibernate generates to the console...
spring.jpa.show-sql=true
# ...and pretty-print it across lines so it's readable while you study the flow.
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Redis (cache). Matches docker-compose.yml.
# ---------------------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---------------------------------------------------------------------------
# Logging: ensure OUR service's CACHE HIT / CACHE MISS log lines are visible.
# (INFO is shown by default, but we set it explicitly so it's obvious and easy
#  to bump to DEBUG later.)
# ---------------------------------------------------------------------------
logging.level.com.meesho.library=INFO
